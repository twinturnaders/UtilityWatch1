name: CI/CD (Build, Push, Deploy)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            image: docker.io/thatsmypurse/utilitywatch-backend
          - name: frontend
            context: frontend
            image: docker.io/thatsmypurse/utilitywatch-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=v1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
        - name: "Configure SSH"
          env:
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_PORT: ${{ secrets.SSH_PORT }}
          run: |
            mkdir -p ~/.ssh/
            echo "$SSH_KEY" > ~/.ssh/external-machine.key
            chmod 600 ~/.ssh/external-machine.key
            cat >>~/.ssh/config <<END
            Host external-machine
              HostName $SSH_HOST
              User $SSH_USER
              Port $SSH_PORT
              IdentityFile ~/.ssh/external-machine.key
              StrictHostKeyChecking no
            END

        - name: Deploy
          run: ssh external-machine 'cd ~/apps/utilitywatch && ./deploy.sh'
