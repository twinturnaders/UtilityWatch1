spring.application.name=BrinaBright
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/UtilityWatch}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.security.user.name=none
spring.security.user.password=none
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000
logging.level.wgu.edu.BrinaBright.Security=DEBUG

logging.level.org.springframework.security=DEBUG
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true