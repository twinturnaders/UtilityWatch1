name: Build & Push Docker images

on:
  push:
    branches: ["**"]
    tags: ["*"]

jobs:
  build-and-push:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            image: docker.io/thatsmypurse/utilitywatch-backend
          - name: frontend
            context: frontend
            image: docker.io/thatsmypurse/utilitywatch-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_TOKEN }}
          password: ${{ secrets.DH_TOKEN }}

      # Generate tags similar to your GitLab logic:
      #  - sha tag
      #  - branch tag
      #  - stable tag "1.0" (always)
      #  - latest (only on default branch)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=v1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}